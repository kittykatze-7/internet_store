<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROZETKA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/favicon.ico" sizes="any">
</head>
<body>
    <header>
        <button class="menu-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>
        
        <div class="logo">
            <img src="images/logo.JPG" alt="ROZETKA Logo" class="logo-icon">
            <div class="logo-text">
                <h1>ROZETKA</h1>
                <div class="smart-badge">
                    <span>Спробуйте </span>
                    <span class="smart-box">SMART</span>
                </div>
            </div>
        </div>
        
        <button class="catalog-btn">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="white">
                <rect x="2" y="2" width="5" height="5"></rect>
                <rect x="8" y="2" width="5" height="5"></rect>
                <rect x="14" y="2" width="4" height="5"></rect>
                <rect x="2" y="8" width="5" height="5"></rect>
                <rect x="8" y="8" width="5" height="5"></rect>
                <rect x="14" y="8" width="4" height="5"></rect>
                <rect x="2" y="14" width="5" height="4"></rect>
                <rect x="8" y="14" width="5" height="4"></rect>
                <rect x="14" y="14" width="4" height="4"></rect>
            </svg>
            <span>Каталог</span>
        </button>
        
        <div class="search-wrapper">
            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#666" stroke-width="2">
                    <circle cx="9" cy="9" r="6"></circle>
                    <path d="m15 15-3-3"></path>
                </svg>
                <input type="text" placeholder="Я шукаю..." class="search-input">
                <svg class="mic-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#666" stroke-width="2">
                    <path d="M10 2v6"></path>
                    <path d="M7 8a3 3 0 0 0 6 0"></path>
                    <path d="M5 10a5 5 0 0 0 10 0"></path>
                    <line x1="10" y1="18" x2="10" y2="16"></line>
                    <line x1="6" y1="16" x2="14" y2="16"></line>
                </svg>
            </div>
            
            <button class="search-btn">Знайти</button>
        </div>
        
        <button class="icon-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </button>
        
        <button class="icon-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <path d="M12 2v20"></path>
                <path d="M2 12h20"></path>
                <path d="M6 8l-2-2 2-2"></path>
                <path d="M18 8l2-2-2-2"></path>
                <path d="M6 16l-2 2 2 2"></path>
                <path d="M18 16l2 2-2 2"></path>
                <circle cx="6" cy="6" r="2"></circle>
                <circle cx="18" cy="6" r="2"></circle>
                <circle cx="6" cy="18" r="2"></circle>
                <circle cx="18" cy="18" r="2"></circle>
            </svg>
        </button>
        
        <button class="icon-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
        </button>
    </header>
</body>
</html>
